name: Release

on:
  push:
    tags:
      - "macos-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # TraeBar 独立发布：打 macos-v* tag 时产出通用（arm64+x86_64）二进制并创建 Release。
  # 版本号 = tag（如 macos-v1.0.0），与 Windows 版（main 分支的 v* tag）完全独立。
  macos-publish:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build TraeBar (Release, universal)
        run: |
          cd macos
          swift build -c release --arch arm64 --arch x86_64
          ls -la .build/apple/Products/release/ | head

      - name: Package TraeBar
        run: |
          cd macos
          zip -j TraeBar-macos.zip .build/apple/Products/release/TraeBar
          ls -la TraeBar-macos.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TraeBar ${{ github.ref_name }}"
          body: "TraeBar ${{ github.ref_name }} — macOS 菜单栏版多账号自动签到（arm64 + x86_64 通用二进制）"
          files: macos/TraeBar-macos.zip
          generate_release_notes: true