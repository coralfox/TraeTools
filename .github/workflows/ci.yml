name: CI

on:
  push:
    branches: [macos]
  pull_request:
    branches: [macos]

permissions:
  contents: read

jobs:
  # TraeBar（macos/ 目录，Swift/AppKit 独立工程）：验证 swift build 可编译
  macos-swift:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build TraeBar (Release)
        run: |
          cd macos
          swift build -c release

      - name: Upload TraeBar binary
        uses: actions/upload-artifact@v4
        with:
          name: trae-bar-macos
          path: macos/.build/release/TraeBar
          if-no-files-found: error